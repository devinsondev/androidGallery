name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Android SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter sdkmanager.bat |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $sdkManager) {
            throw "sdkmanager.bat not found under ANDROID_HOME"
          }
          & $sdkManager.FullName "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - uses: gradle/actions/setup-gradle@v4

      - name: Build security preflight (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f gradle/wrapper/gradle-wrapper.properties
          grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties
          test -f gradle/verification-metadata.xml
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Build security preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "gradle\wrapper\gradle-wrapper.properties")) {
            throw "gradle-wrapper.properties is missing"
          }
          if (-not (Select-String -Path "gradle\wrapper\gradle-wrapper.properties" -Pattern '^distributionSha256Sum=' -Quiet)) {
            throw "distributionSha256Sum is missing"
          }
          if (-not (Test-Path "gradle\verification-metadata.xml")) {
            throw "verification-metadata.xml is missing"
          }
          $expected = "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7"
          $actual = (Get-FileHash "gradle\wrapper\gradle-wrapper.jar" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Gradle wrapper JAR checksum mismatch"
          }

      - name: Unit tests (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :app:testDebugUnitTest

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest

      - name: Assemble debug (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :app:assembleDebug

      - name: Assemble debug (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat :app:assembleDebug
