name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle wrapper JAR
        run: echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Regenerate dependency verification metadata from clean resolution
        shell: bash
        run: |
          rm -f gradle/verification-metadata.xml
          ./gradlew --refresh-dependencies --write-verification-metadata sha256 :app:testDebugUnitTest :app:assembleDebug
      - name: Commit verification metadata to main
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cp gradle/verification-metadata.xml "$RUNNER_TEMP/verification-metadata.xml"
          git fetch origin main
          git checkout -B verification-metadata-commit origin/main
          mkdir -p gradle
          cp "$RUNNER_TEMP/verification-metadata.xml" gradle/verification-metadata.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "build: refresh Gradle dependency verification metadata"
          git push origin HEAD:main
