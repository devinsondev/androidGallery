name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  EXPECTED_GRADLE_URL: https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
  EXPECTED_GRADLE_SHA256: 553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
  EXPECTED_WRAPPER_JAR_SHA256: 497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Android SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter sdkmanager.bat |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $sdkManager) {
            throw "sdkmanager.bat not found under ANDROID_HOME"
          }
          & $sdkManager.FullName "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build security preflight (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/verification-metadata.xml
          grep -Fxq "distributionUrl=$EXPECTED_GRADLE_URL" gradle/wrapper/gradle-wrapper.properties
          grep -Fxq "distributionSha256Sum=$EXPECTED_GRADLE_SHA256" gradle/wrapper/gradle-wrapper.properties
          echo "$EXPECTED_WRAPPER_JAR_SHA256  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Build security preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = @(
            "gradlew",
            "gradlew.bat",
            "gradle\wrapper\gradle-wrapper.jar",
            "gradle\wrapper\gradle-wrapper.properties",
            "gradle\verification-metadata.xml"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required build-security file: $path"
            }
          }
          $props = Get-Content "gradle\wrapper\gradle-wrapper.properties"
          if ($props -notcontains "distributionUrl=$env:EXPECTED_GRADLE_URL") {
            throw "Unexpected Gradle distributionUrl"
          }
          if ($props -notcontains "distributionSha256Sum=$env:EXPECTED_GRADLE_SHA256") {
            throw "Unexpected Gradle distributionSha256Sum"
          }
          $actual = (Get-FileHash "gradle\wrapper\gradle-wrapper.jar" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_WRAPPER_JAR_SHA256) {
            throw "Gradle wrapper JAR checksum mismatch"
          }

      - name: Verify local BAT property parsing (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "EXPECTED_DISTRIBUTION_URL=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip"
          set "EXPECTED_DISTRIBUTION_SHA256=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746"
          set "ACTUAL_DISTRIBUTION_URL="
          set "ACTUAL_DISTRIBUTION_SHA256="
          for /f "usebackq tokens=1,* delims==" %%A in ("gradle\wrapper\gradle-wrapper.properties") do @if "%%A"=="distributionUrl" set "ACTUAL_DISTRIBUTION_URL=%%B"
          for /f "usebackq tokens=1,* delims==" %%A in ("gradle\wrapper\gradle-wrapper.properties") do @if "%%A"=="distributionSha256Sum" set "ACTUAL_DISTRIBUTION_SHA256=%%B"
          if not "%ACTUAL_DISTRIBUTION_URL%"=="%EXPECTED_DISTRIBUTION_URL%" exit /b 1
          if /I not "%ACTUAL_DISTRIBUTION_SHA256%"=="%EXPECTED_DISTRIBUTION_SHA256%" exit /b 1

      - name: Unit tests (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew --dependency-verification strict :app:testDebugUnitTest

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --dependency-verification strict :app:testDebugUnitTest

      - name: Assemble debug (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew --dependency-verification strict :app:assembleDebug

      - name: Assemble debug (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --dependency-verification strict :app:assembleDebug
