name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  EXPECTED_GRADLE_URL: https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
  EXPECTED_GRADLE_SHA256: 553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
  EXPECTED_WRAPPER_JAR_SHA256: 497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Android SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter sdkmanager.bat |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $sdkManager) {
            throw "sdkmanager.bat not found under ANDROID_HOME"
          }
          & $sdkManager.FullName "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build security preflight (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/verification-metadata.xml
          grep -Fxq "distributionUrl=$EXPECTED_GRADLE_URL" gradle/wrapper/gradle-wrapper.properties
          grep -Fxq "distributionSha256Sum=$EXPECTED_GRADLE_SHA256" gradle/wrapper/gradle-wrapper.properties
          echo "$EXPECTED_WRAPPER_JAR_SHA256  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Unit tests (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew --dependency-verification strict :app:testDebugUnitTest

      - name: Assemble debug (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew --dependency-verification strict :app:assembleDebug

      - name: Assemble local release (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew --dependency-verification strict :app:assembleLocalRelease

      - name: Prepare canonical Windows workstation paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:\TOOLS\andrstdio" | Out-Null
          $jbr = "D:\TOOLS\andrstdio\jbr"
          if (Test-Path $jbr) {
            Remove-Item $jbr -Recurse -Force
          }
          New-Item -ItemType Junction -Path $jbr -Target $env:JAVA_HOME | Out-Null

          $sdkParent = Join-Path $env:LOCALAPPDATA "Android"
          $sdk = Join-Path $sdkParent "Sdk"
          New-Item -ItemType Directory -Force -Path $sdkParent | Out-Null
          if (Test-Path $sdk) {
            Remove-Item $sdk -Recurse -Force
          }
          New-Item -ItemType Junction -Path $sdk -Target $env:ANDROID_HOME | Out-Null

      - name: Run canonical Windows local release helper without ambient Java
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "JAVA_HOME="
          set "PATH=%SystemRoot%\System32;%SystemRoot%"
          call build-local-release.bat
